name: cec.lt stock watch

on:
  schedule:
    # Every 5 minutes. GitHub treats this as "no sooner than", not a promise -
    # see the README for the realistic timing you should actually expect.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test push instead of checking stock"
        type: boolean
        default: false
      duration_minutes:
        description: "How long this run should keep polling (max 350)"
        type: string
        default: "4"
      interval_seconds:
        description: "Seconds between checks (default 900 = 15 min)"
        type: string
        default: "900"

# If a previous run is still going, let it finish rather than piling up.
concurrency:
  group: stock-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runners are ephemeral, so carry the state file between runs. A cache
      # key cannot be overwritten, so write a unique one each run and restore
      # the most recent via the prefix. A cache miss (eviction, first run on a
      # branch) costs at most one duplicate alert - never a missed one.
      - name: Restore watcher state
        uses: actions/cache/restore@v4
        with:
          path: state/stock_watch_state.json
          key: stock-watch-state-${{ github.run_id }}
          restore-keys: |
            stock-watch-state-

      - name: Check stock
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_WATCH_STATE: state/stock_watch_state.json
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          mkdir -p state
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            # Proves the NTFY_TOPIC secret is wired up, without waiting for
            # a real restock to find out.
            python stock_watch.py --test-alert
            exit $?
          fi
          # --duration makes one run cover a ~4 minute window with
          # 80s polling, instead of sampling a single instant. GitHub
          # cron timing is irregular, so covering a window matters
          # more than firing precisely on schedule.
          mins="${{ inputs.duration_minutes || '4' }}"
          case "$mins" in ''|*[!0-9]*) mins=4 ;; esac
          [ "$mins" -gt 350 ] && mins=350
          secs="${{ inputs.interval_seconds || '900' }}"
          case "$secs" in ''|*[!0-9]*) secs=900 ;; esac
          [ "$secs" -lt 60 ] && secs=60
          echo "polling for ${mins} min, every ${secs}s"
          python stock_watch.py --once --duration $((mins * 60)) --interval "$secs" --watch-category
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          case $code in
            0) echo "::notice::IN STOCK - alert sent" ;;
            1) echo "Not in stock." ;;
            2) echo "::warning::Fetch or parse error" ;;
          esac
          # Exit 1 just means "not in stock" - that is not a build failure.
          # Only a genuine error (2) should mark the run red.
          [ -f state/stock_watch_state.json ] || echo '{}' > state/stock_watch_state.json
          [ "$code" = "2" ] && exit 1
          exit 0

      - name: Save watcher state
        # Always save, even when the check errored, so the consecutive-unknown
        # counter survives and can reach its alert threshold. The guard keeps
        # a first-run fetch error from failing the cache step.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state/stock_watch_state.json
          key: stock-watch-state-${{ github.run_id }}

      # GitHub's cron scheduler never fired for this repo, so each run starts
      # its successor instead. workflow_dispatch is reliable here in a way
      # schedule is not. GITHUB_TOKEN deliberately cannot trigger workflows,
      # which is why this needs a PAT.
      #
      # always() so that even a failed check hands over: a broken link would
      # stop the watch silently, and silence is indistinguishable from
      # "no stock yet" - the worst possible failure here.
      - name: Start the next run
        if: always() && inputs.test_alert != true
        env:
          GH_TOKEN: ${{ secrets.WATCH_PAT }}
          STOP_AFTER: "20260909"
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::WATCH_PAT is not set - the chain stops here"
            exit 0
          fi
          today=$(date -u +%Y%m%d)
          if [ "$today" -gt "$STOP_AFTER" ]; then
            echo "::notice::Past $STOP_AFTER - watch finished, not chaining"
            exit 0
          fi
          mins="${{ inputs.duration_minutes || '350' }}"
          secs="${{ inputs.interval_seconds || '900' }}"
          echo "chaining next run: ${mins} min at ${secs}s interval"
          gh workflow run watch.yml \
            --repo "${{ github.repository }}" \
            -f duration_minutes="$mins" \
            -f interval_seconds="$secs"
